<script>
  // TARIFAS DIRECTAS POR HORA de tu planilla (Columnas K y L)
  const tarifarioHora = {
    "Ama de Llaves": { diurno: 13132.44, nocturno: 14838.76 },
    "Banquetes": { diurno: 14838.76, nocturno: 16767.81 },
    "Cocina": { diurno: 14240.54, nocturno: 16091.10 },
    "Front": { diurno: 11674.65, nocturno: 13191.07 },
    "Health Club": { diurno: 14228.95, nocturno: 16079.26 },
    "Lavanderia": { diurno: 11674.65, nocturno: 13191.07 },
    "Limpieza": { diurno: 11674.65, nocturno: 13191.07 },
    "Mantenimiento": { diurno: 11674.65, nocturno: 13191.07 },
    "Seguridad": { diurno: 13132.44, nocturno: 14838.76 },
    "Steward": { diurno: 11674.65, nocturno: 13191.07 }
  };

  let listaEmpleados = [];
  let contadorPuestos = {};

  function mostrarTab(tipo) {
    if (tipo === 'masivo') {
      document.getElementById('form-masivo').style.display = 'block';
      document.getElementById('form-individual').style.display = 'none';
      document.getElementById('tab-masivo-btn').classList.add('active');
      document.getElementById('tab-individual-btn').classList.remove('active');
    } else {
      document.getElementById('form-masivo').style.display = 'none';
      document.getElementById('form-individual').style.display = 'block';
      document.getElementById('tab-masivo-btn').classList.remove('active');
      document.getElementById('tab-individual-btn').classList.add('active');
    }
  }

  function agregarMasivo() {
    const evento = document.getElementById('evento').value;
    const departamento = document.getElementById('m_departamento').value;
    const cantidad = parseInt(document.getElementById('m_cantidad').value) || 1;
    const horaInicio = document.getElementById('m_horaInicio').value;
    const horaFin = document.getElementById('m_horaFin').value;
    const bono = parseFloat(document.getElementById('m_bono').value) || 0;

    if (!horaInicio || !horaFin) {
      alert("Ingresa hora de entrada y salida.");
      return;
    }

    for (let i = 0; i < cantidad; i++) {
      contadorPuestos[departamento] = (contadorPuestos[departamento] || 0) + 1;
      const nombreEtiqueta = `${departamento} ${contadorPuestos[departamento]}`;
      crearYGuardarEmpleado(evento, departamento, nombreEtiqueta, horaInicio, horaFin, bono);
    }

    actualizarTabla();
  }

  function agregarIndividual() {
    const evento = document.getElementById('evento').value;
    const departamento = document.getElementById('departamento').value;
    let nombre = document.getElementById('nombreEmpl').value.trim();
    const horaInicio = document.getElementById('horaInicio').value;
    const horaFin = document.getElementById('horaFin').value;
    const bono = parseFloat(document.getElementById('bono').value) || 0;

    if (!horaInicio || !horaFin) {
      alert("Ingresa hora de entrada y salida.");
      return;
    }

    if (!nombre) {
      contadorPuestos[departamento] = (contadorPuestos[departamento] || 0) + 1;
      nombre = `${departamento} ${contadorPuestos[departamento]}`;
    }

    crearYGuardarEmpleado(evento, departamento, nombre, horaInicio, horaFin, bono);
    document.getElementById('nombreEmpl').value = '';
    actualizarTabla();
  }

  function crearYGuardarEmpleado(evento, departamento, nombre, horaInicio, horaFin, bono) {
    const desglose = calcularDesgloseExacto(evento, horaInicio, horaFin);
    const tarifa = tarifarioHora[departamento] || { diurno: 11674.65, nocturno: 13191.07 };

    // FÓRMULA EXACTA DEL EXCEL:
    // (Hs Diurnas * Tarifa Diurna) + (Hs Nocturnas * Tarifa Nocturna) + (Hs Feriado * Tarifa Diurna) + Bono
    const costoDiurno = desglose.diurnas * tarifa.diurno;
    const costoNocturno = desglose.nocturnas * tarifa.nocturno;
    const costoFeriado = desglose.feriado * tarifa.diurno; 
    const costoTotal = costoDiurno + costoNocturno + costoFeriado + bono;

    listaEmpleados.push({
      id: Date.now() + Math.random(),
      evento,
      departamento,
      nombre,
      horario: `${horaInicio} a ${horaFin}`,
      horasDiurnas: desglose.diurnas.toFixed(1),
      horasNocturnas: desglose.nocturnas.toFixed(1),
      horasFeriado: desglose.feriado.toFixed(1),
      costoTotal
    });
  }

  function calcularDesgloseExacto(evento, inicio, fin) {
    let [h1, m1] = inicio.split(':').map(Number);
    let [h2, m2] = fin.split(':').map(Number);

    let tInicio = h1 + m1 / 60;
    let tFin = h2 + m2 / 60;

    if (tFin <= tInicio) {
      tFin += 24; // Cruza la medianoche
    }

    let diurnas = 0;
    let nocturnas = 0;
    let feriado = 0;

    const esEvento24o31 = evento.includes('Navidad') || evento.includes('Nuevo');

    for (let t = tInicio; t < tFin; t += 0.25) {
      let horaDelDia = t % 24;
      let esSegundoDia = t >= 24;

      // Evaluar franja Diurna (06:00 - 21:00) vs Nocturna (21:00 - 06:00)
      if (horaDelDia >= 6 && horaDelDia < 21) {
        diurnas += 0.25;
      } else {
        nocturnas += 0.25;
      }

      // Horas feriado: Si arranca el 24 o 31 y pasa de las 00:00 hs (segundo día)
      if (esSegundoDia) {
        feriado += 0.25;
      }
    }

    return { diurnas, nocturnas, feriado };
  }

  function eliminarEmpleado(id) {
    listaEmpleados = listaEmpleados.filter(e => e.id !== id);
    actualizarTabla();
  }

  function actualizarTabla() {
    const tbody = document.getElementById('tabla-cuerpo');
    tbody.innerHTML = '';
    let totalGeneral = 0;

    listaEmpleados.forEach(e => {
      totalGeneral += e.costoTotal;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><span class="badge">${e.evento}</span></td>
        <td>${e.departamento}</td>
        <td><strong>${e.nombre}</strong></td>
        <td>${e.horario}</td>
        <td>${e.horasDiurnas} hs</td>
        <td>${e.horasNocturnas} hs</td>
        <td>${e.horasFeriado} hs</td>
        <td>$${e.costoTotal.toLocaleString('es-AR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
        <td><button class="btn-danger" onclick="eliminarEmpleado(${e.id})">x</button></td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById('monto-total').innerText = 
      '$' + totalGeneral.toLocaleString('es-AR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  }
</script>
